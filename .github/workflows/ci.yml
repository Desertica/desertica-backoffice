name: CI

on:
  pull_request:
    branches: [develop, staging, prod]
  push:
    branches: [develop, staging, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run build
      - name: No analytics or marketing scripts (only Google Identity Services is allowed)
        run: |
          if grep -rniE 'googletagmanager|fbevents|hotjar|clarity' src; then
            echo "::error::Third-party analytics are not allowed in the backoffice"; exit 1
          fi

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: The image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

