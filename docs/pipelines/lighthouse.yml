# Copiar a .github/workflows/lighthouse.yml. Informativo: NO marcar como requerido.
name: Lighthouse
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'
permissions:
  contents: read
jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    env:
      PROD_URL: ${{ vars.PROD_URL }}
    steps:
      - name: Sin PROD_URL
        if: env.PROD_URL == ''
        run: |
          echo "Variable de repo PROD_URL vacia, nada que auditar. OK."
          exit 0
      - if: env.PROD_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Solo audita la pagina de login: el resto esta detras de sesion.
      - if: env.PROD_URL != ''
        run: npx --yes @lhci/cli@0.15.1 collect --url="$PROD_URL" --numberOfRuns=1 && npx --yes @lhci/cli@0.15.1 upload --target=temporary-public-storage
